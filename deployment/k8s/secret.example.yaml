# Template — copy to secret.yaml and fill in all <CHANGE_ME> values before applying.
# OR run: oc create secret generic nl2sql-secret --from-env-file=backend/.env.local -n nl2sql
#
# secret.yaml is gitignored; only this template is committed.
apiVersion: v1
kind: Secret
metadata:
  name: nl2sql-secret
  namespace: nl2sql
type: Opaque
stringData:
  # MySQL full-access credentials (must match mysql/statefulset.yaml env)
  DB_USER: nl2sql_user
  DB_PASSWORD: <CHANGE_ME>
  # MySQL read-only credentials (created by seed-job)
  DB_READONLY_USER: nl2sql_readonly
  DB_READONLY_PASSWORD: <CHANGE_ME>
  # MySQL root password (used by StatefulSet and seed-job)
  MYSQL_ROOT_PASSWORD: <CHANGE_ME>
  # LLM
  ANTHROPIC_API_KEY: <CHANGE_ME>
  # LangSmith (set to empty string to disable tracing)
  LANGCHAIN_API_KEY: <CHANGE_ME>
