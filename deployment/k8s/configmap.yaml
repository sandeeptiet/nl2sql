apiVersion: v1
kind: ConfigMap
metadata:
  name: nl2sql-config
  namespace: nl2sql
data:
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_NAME: nl2sql
  APP_ENV: production
  FAISS_INDEX_PATH: /app/data/faiss.index
  LANGCHAIN_PROJECT: nl2sql-ocp
  LANGCHAIN_TRACING_V2: "true"
  MAX_ROWS_DEFAULT: "100"
  # Backend service URL used by the frontend rewrite proxy
  BACKEND_URL: http://nl2sql-backend:8000
