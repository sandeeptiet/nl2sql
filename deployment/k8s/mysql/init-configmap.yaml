apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init-scripts
  namespace: nl2sql
data:
  # 01 — e-commerce schema (runs as root on first container start)
  01_schema.sql: |
    SET FOREIGN_KEY_CHECKS = 0;
    DROP TABLE IF EXISTS reviews;
    DROP TABLE IF EXISTS order_items;
    DROP TABLE IF EXISTS orders;
    DROP TABLE IF EXISTS products;
    DROP TABLE IF EXISTS categories;
    DROP TABLE IF EXISTS customers;
    SET FOREIGN_KEY_CHECKS = 1;

    CREATE TABLE categories (
        id          INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        name        VARCHAR(100) NOT NULL,
        description TEXT,
        created_at  DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

    CREATE TABLE customers (
        id         INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        name       VARCHAR(150) NOT NULL,
        email      VARCHAR(255) NOT NULL UNIQUE,
        city       VARCHAR(100),
        state      VARCHAR(100),
        country    VARCHAR(100) NOT NULL DEFAULT 'India',
        created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
        INDEX idx_customers_city (city),
        INDEX idx_customers_created_at (created_at)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

    CREATE TABLE products (
        id          INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        category_id INT UNSIGNED NOT NULL,
        name        VARCHAR(255) NOT NULL,
        description TEXT,
        price       DECIMAL(10,2) NOT NULL,
        stock       INT UNSIGNED NOT NULL DEFAULT 0,
        is_active   TINYINT(1) NOT NULL DEFAULT 1,
        created_at  DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at  DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
        FOREIGN KEY (category_id) REFERENCES categories(id),
        INDEX idx_products_category (category_id),
        INDEX idx_products_price (price),
        INDEX idx_products_is_active (is_active)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

    CREATE TABLE orders (
        id              INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        customer_id     INT UNSIGNED NOT NULL,
        status          ENUM('pending','processing','shipped','delivered','cancelled') NOT NULL DEFAULT 'pending',
        total           DECIMAL(10,2) NOT NULL,
        shipping_charge DECIMAL(10,2) NOT NULL DEFAULT 0.00,
        tax             DECIMAL(10,2) NOT NULL DEFAULT 0.00,
        created_at      DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at      DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
        delivered_at    DATETIME,
        FOREIGN KEY (customer_id) REFERENCES customers(id),
        INDEX idx_orders_customer (customer_id),
        INDEX idx_orders_status (status),
        INDEX idx_orders_created_at (created_at),
        INDEX idx_orders_delivered_at (delivered_at)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

    CREATE TABLE order_items (
        id         INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        order_id   INT UNSIGNED NOT NULL,
        product_id INT UNSIGNED NOT NULL,
        quantity   INT UNSIGNED NOT NULL DEFAULT 1,
        unit_price DECIMAL(10,2) NOT NULL,
        subtotal   DECIMAL(10,2) NOT NULL,
        created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
        FOREIGN KEY (order_id)   REFERENCES orders(id),
        FOREIGN KEY (product_id) REFERENCES products(id),
        INDEX idx_order_items_order   (order_id),
        INDEX idx_order_items_product (product_id)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

    CREATE TABLE reviews (
        id          INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        product_id  INT UNSIGNED NOT NULL,
        customer_id INT UNSIGNED NOT NULL,
        rating      TINYINT UNSIGNED NOT NULL CHECK (rating BETWEEN 1 AND 5),
        comment     TEXT,
        created_at  DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
        FOREIGN KEY (product_id)  REFERENCES products(id),
        FOREIGN KEY (customer_id) REFERENCES customers(id),
        UNIQUE KEY uq_review (product_id, customer_id),
        INDEX idx_reviews_product  (product_id),
        INDEX idx_reviews_rating   (rating),
        INDEX idx_reviews_created  (created_at)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

  # 02 — admin tables (mirroring backend init_db.py)
  02_admin_tables.sql: |
    CREATE TABLE IF NOT EXISTS query_logs (
        id            INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        nl_input      TEXT NOT NULL,
        generated_sql TEXT,
        query_type    VARCHAR(50),
        status        VARCHAR(20),
        latency_ms    FLOAT,
        row_count     INT,
        error_msg     TEXT,
        created_at    DATETIME DEFAULT CURRENT_TIMESTAMP
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

    CREATE TABLE IF NOT EXISTS few_shot_examples (
        id         INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        question   TEXT NOT NULL,
        `sql`      TEXT NOT NULL,
        query_type VARCHAR(50),
        created_at DATETIME DEFAULT CURRENT_TIMESTAMP,
        updated_at DATETIME DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

    CREATE TABLE IF NOT EXISTS schema_metadata (
        id          INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        table_name  VARCHAR(100) NOT NULL,
        column_name VARCHAR(100) NOT NULL,
        description TEXT,
        is_sensitive TINYINT(1) DEFAULT 0
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

    CREATE TABLE IF NOT EXISTS guardrails (
        id         INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        operation  VARCHAR(50) NOT NULL UNIQUE,
        is_blocked TINYINT(1) NOT NULL DEFAULT 1
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

    CREATE TABLE IF NOT EXISTS model_config (
        id           INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        llm_provider VARCHAR(50)  DEFAULT 'anthropic',
        model_name   VARCHAR(100) DEFAULT 'claude-sonnet-4-6',
        temperature  FLOAT        DEFAULT 0.0,
        dialect      VARCHAR(20)  DEFAULT 'mysql',
        max_tokens   INT          DEFAULT 1000
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
