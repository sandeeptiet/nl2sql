apiVersion: v1
kind: Pod
metadata:
  name: backend-debug
  namespace: nl2sql
spec:
  restartPolicy: Never
  containers:
    - name: debug
      image: quay.io/sandeeptiet/nl2sql-backend:1.9
      command: ["/app/.venv/bin/python"]
      args:
        - "-u"
        - "-c"
        - |
          print("test 1: import cryptography (top level)", flush=True)
          import cryptography
          print("  ok", flush=True)
          print("test 2: import cryptography.hazmat.bindings._rust", flush=True)
          from cryptography.hazmat.bindings import _rust
          print("  ok", flush=True)
          print("test 3: import cryptography.fernet", flush=True)
          from cryptography import fernet
          print("  ok", flush=True)
