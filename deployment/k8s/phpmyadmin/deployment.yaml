apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpmyadmin
  namespace: nl2sql
  labels:
    app: phpmyadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phpmyadmin
  template:
    metadata:
      labels:
        app: phpmyadmin
    spec:
      serviceAccountName: phpmyadmin-sa    # ← this is enough
      containers:
        - name: phpmyadmin
          image: docker.io/phpmyadmin:5.2-apache
          ports:
            - containerPort: 80
              name: http
          env:
            - name: PMA_HOST
              value: "mysql"
            - name: PMA_PORT
              value: "3306"
            # Optional — pre-fill the user; remove if you want a login screen
            # - name: PMA_USER
            #   valueFrom:
            #     secretKeyRef:
            #       name: nl2sql-secret
            #       key: DB_USER
            # - name: PMA_PASSWORD
            #   valueFrom:
            #     secretKeyRef:
            #       name: nl2sql-secret
            #       key: DB_PASSWORD
            - name: UPLOAD_LIMIT
              value: "64M"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: phpmyadmin
  namespace: nl2sql
  labels:
    app: phpmyadmin
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: phpmyadmin
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: phpmyadmin
  namespace: nl2sql
  labels:
    app: phpmyadmin
spec:
  to:
    kind: Service
    name: phpmyadmin
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
